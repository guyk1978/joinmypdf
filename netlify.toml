# Netlify headers — SharedArrayBuffer / FFmpeg.wasm require COOP + COEP.
# worker-src allows the absolute /workers/ffmpeg-worker.js script and blob: cores.
# frame-ancestors 'self' + X-Frame-Options SAMEORIGIN allow same-origin iframes
# (Device Preview / tool embeds) while blocking third-party clickjacking.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "worker-src 'self' blob:; frame-ancestors 'self';"

[[headers]]
  for = "/workers/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/ffmpeg/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"
    Cache-Control = "public, max-age=31536000, immutable"
